name: Build and Upload BCH Stealth Plugin

on:
  push:
    tags:
      - 'plugin-v*'

jobs:
  build-and-upload:
    name: Build stealth.zip and upload to release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build stealth.zip
        run: |
          cd stealth
          zip -r ../stealth.zip . -x "__pycache__/*" "*.pyc" ".DS_Store"
          cd ..
          echo "Built stealth.zip:"
          unzip -l stealth.zip

      - name: Generate sha256 checksum
        run: |
          sha256sum stealth.zip > stealth.zip.sha256
          echo "SHA256: $(cat stealth.zip.sha256)"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            stealth.zip
            stealth.zip.sha256
